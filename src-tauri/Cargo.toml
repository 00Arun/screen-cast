[package]
name = "screen_cast"
version = "1.0.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-proxy"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
qrcodegen = "1.8"
url = "2"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
webrtc = "0.21"
rtc = "0.21"
async-trait = "0.1"
openh264 = "0.9"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
audiopus_sys = { version = "0.2", features = ["static"] }

# macOS: ScreenCaptureKit capture + VideoToolbox (raw FFI) + WebKit content rules
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"

# Windows: Windows.Graphics.Capture + OpenH264 + WASAPI loopback + WebView2 request filter
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

# Linux: X11 window capture + OpenH264 + PulseAudio/PipeWire monitor + WebKitGTK content filters
[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
x11rb = { version = "0.13", features = ["composite"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
webkit2gtk-sys = "=2.0.2"
glib-sys = "0.18"
gobject-sys = "0.18"
gio-sys = "0.18"
gtk = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
