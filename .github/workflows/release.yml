name: Release

# On every push to main whose VERSION has no release yet:
#   1. build the installers for macOS (universal .dmg), Windows (.exe/.msi) and Linux (.deb/.AppImage)
#   2. tag vX.Y.Z and create a GitHub release with the installers, SHA256SUMS.txt and the
#      CHANGELOG entry as notes
# (The npm library is published separately by npm-publish.yml.)
# Bump the version with `scripts/bump-version.sh` (the build scripts do it automatically),
# add a CHANGELOG entry, commit and push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V is already released, nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V is new, building a release."
          fi

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build universal app + DMG (App Sandbox, signed)
        env:
          NO_BUMP: "1"
          UNIVERSAL: "1"
        run: |
          scripts/build-dmg.sh
          mkdir -p out
          mv "dist/ScreenCast-$V.dmg" "out/ScreenCast-$V-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build installers
        shell: bash
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build -- --locked
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/ScreenCast-$V-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "out/ScreenCast-$V-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf cmake file
      - name: Build installers
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build -- --locked
      - name: Collect
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb "out/ScreenCast-$V-linux-amd64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/ScreenCast-$V-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  github-release:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag, create the release
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Tag and GitHub release
        run: |
          # Release notes = the "## [V]" section of the CHANGELOG
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "Screen Cast $V" > /tmp/notes.md
          printf '\n---\nDownload the installer for your system below and verify it with `SHA256SUMS.txt`.\n' >> /tmp/notes.md
          if ! git rev-parse "v$V" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$V" -m "Screen Cast $V"
            git push origin "v$V"
          fi
          gh release view "v$V" >/dev/null 2>&1 || \
            gh release create "v$V" out/* --title "Screen Cast $V" --notes-file /tmp/notes.md
