name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev cmake

      - name: Tests (ad blocking, URL policy, filtering proxy, QR, encoders)
        run: cargo test --locked

      - name: End-to-end media self-test (encoder -> WebRTC -> viewer)
        if: runner.os == 'macOS'
        env:
          SC_BIND_IP: 127.0.0.1
        run: cargo run --locked -- --selftest "$RUNNER_TEMP/selftest.h264"

  npm:
    name: npm installer package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Version matches VERSION file
        run: |
          V=$(tr -d '[:space:]' < ../VERSION)
          P=$(node -p "require('./package.json').version")
          [ "$V" = "$P" ] || { echo "::error::npm/package.json is $P but VERSION is $V (run scripts/bump-version.sh set $V)"; exit 1; }

      - name: Syntax and unit tests
        run: |
          node --check bin/screen-cast.js
          npm test
          node bin/screen-cast.js help

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Pack (dry run) to check publish contents
        run: npm pack --dry-run
