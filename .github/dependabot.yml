version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri*", "wry", "tao"]
      webrtc:
        patterns: ["webrtc", "rtc*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
